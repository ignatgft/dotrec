name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Install dependencies (Mobile)
        run: flutter pub get

      - name: Analyze (Mobile)
        run: flutter analyze

      - name: Run Tests (Mobile)
        run: flutter test

      - name: Install dependencies (Desktop)
        run: |
          cd desktop
          flutter pub get

      - name: Analyze (Desktop)
        run: |
          cd desktop
          flutter analyze

      - name: Run Tests (Desktop)
        run: |
          cd desktop
          flutter test

  build:
    name: Build Release Artifacts
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Build Android Release APKs
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Package Desktop Client
        run: |
          cd desktop
          flutter pub get
          dart run tool/package_windows.dart
          Compress-Archive -Path build/dist/DotRec-Link-v1.0.0-windows-x64/* -DestinationPath build/dist/DotRec-Link-v1.0.0-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            desktop/build/dist/DotRec-Link-v1.0.0-windows-x64.zip
          generate_release_notes: true
