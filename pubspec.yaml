name: dotrec
description: "DotRec — бесплатная, удобная и приватная запись экрана Android в стиле Nothing OS. Без рекламы, водяных знаков и сети."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-Variable.ttf
